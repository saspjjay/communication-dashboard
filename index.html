<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SASP Communications — Fall 2026</title>
<style>
  :root{
    --ink:#20242c;
    --ink-soft:#4c525c;
    --ink-faint:#7c828c;
    --card: rgba(255,255,255,0.90);
    --card-solid:#ffffff;
    --line: rgba(46,66,86,0.16);

    --navy:#2e4256;
    --navy-soft:#e3e9ee;
    --forest:#3c5c48;
    --forest-soft:#e5ede6;
    --gold:#93691f;
    --gold-soft:#f2e8d4;
    --maroon:#7c3b3b;
    --maroon-soft:#f3e3e1;

    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:15px;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% -10%, rgba(255,255,255,0.06), transparent 40%),
      linear-gradient(160deg, #1c2a3a 0%, #24384a 45%, #2e4256 100%);
    background-attachment:fixed;
  }
  a{color:inherit;}
  h1,h2,h3{font-family:'Iowan Old Style','Georgia',serif;}

  #topbar{
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,0.14);
    padding:18px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand-eyebrow{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#cfe0ee;
    font-weight:700;
    margin:0 0 3px 0;
  }
  .brand-title{
    margin:0;
    font-size:20px;
    font-weight:600;
    color:#ffffff;
  }
  #nav-links{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .nav-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:20px;
    padding:8px 17px;
    font-size:13px;
    font-weight:600;
    color:#e8eef4;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.18);}
  .nav-btn.active{background:#ffffff; border-color:#ffffff; color:var(--navy);}

  #main{
    max-width:1120px;
    margin:0 auto;
    padding:44px 40px 80px;
  }

  /* ---- Overview layout: sidebar + week list ---- */
  .overview-layout{
    display:flex;
    gap:28px;
    align-items:flex-start;
  }
  .week-sidebar{
    width:170px;
    flex-shrink:0;
    position:sticky;
    top:96px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 130px);
    padding-right:4px;
    transition:width .22s ease;
  }
  .week-sidebar.collapsed{
    width:40px;
  }
  .week-sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:0 2px 10px 2px;
    flex-shrink:0;
  }
  .week-sidebar-head-label{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#cfe0ee;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
  }
  .week-sidebar.collapsed .week-sidebar-head-label{
    display:none;
  }
  .sidebar-toggle-btn{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.26);
    color:#e8eef4;
    border-radius:8px;
    width:26px;
    height:26px;
    flex-shrink:0;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease;
  }
  .sidebar-toggle-btn:hover{background:rgba(255,255,255,0.24);}
  .week-sidebar-items{
    display:flex;
    flex-direction:column;
    gap:5px;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .week-sidebar.collapsed .week-sidebar-items{
    display:none;
  }
  .week-sidebar-item{
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:10px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    color:#e8eef4;
    cursor:pointer;
    text-align:left;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .week-sidebar-item:hover{
    background:rgba(255,255,255,0.20);
    transform:translateX(2px);
  }
  .week-sidebar-item.active{
    background:#ffffff;
    border-color:#ffffff;
    color:var(--navy);
  }
  .overview-weeks{
    flex:1;
    min-width:0;
  }

  /* ---- Home: one glass box per week ---- */
  .week-table{
    width:100%;
    background:var(--card);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1.5px solid rgba(255,255,255,0.55);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:26px;
    box-shadow:0 10px 30px rgba(10,20,35,0.18);
    scroll-margin-top:96px;
    transition:box-shadow .3s ease, border-color .3s ease;
  }
  .week-table.jump-highlighted{
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy-soft), 0 10px 30px rgba(10,20,35,0.18);
  }
  .week-head{
    padding:22px 26px 14px 26px;
    text-align:center;
    border-bottom:1.5px solid var(--line);
  }
  .week-block-meta{
    font-size:13px;
    color:var(--ink-faint);
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .week-block-period{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
    font-weight:500;
  }
  .week-table h2{
    margin:6px 0 0 0;
    font-size:23px;
    font-weight:700;
    color:var(--ink);
  }
  .theme-pending{
    font-size:11.5px;
    color:var(--maroon);
    font-weight:700;
    font-style:italic;
    margin:5px 0 0 0;
  }
  .week-body{
    padding:22px 26px 26px 26px;
    display:grid;
    grid-template-columns:1fr 250px;
    gap:14px;
    align-items:stretch;
  }
  .week-left{
    display:flex;
    flex-direction:column;
  }
  .card-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin-bottom:0;
  }
  .type-card{
    border:1.5px solid var(--line);
    border-left:5px solid var(--card-accent, var(--navy));
    border-radius:11px;
    padding:14px 13px 14px 15px;
    text-align:center;
    cursor:pointer;
    background:rgba(255,255,255,0.65);
    transition:box-shadow .18s ease, transform .18s ease, background .18s ease;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:82px;
  }
  .type-card:hover{
    box-shadow:0 8px 20px rgba(20,30,45,0.14);
    transform:translateY(-3px);
    background:rgba(255,255,255,0.92);
  }
  .type-card.rm{
    --card-accent:var(--navy);
    background:var(--navy-soft);
  }
  .type-card.rm:hover{background:#d4e0ea;}
  .type-card.fs{--card-accent:var(--forest);}
  .type-card.sm{--card-accent:var(--gold);}
  .type-card-label{
    font-size:13px;
    font-weight:700;
    color:var(--card-accent, var(--navy));
  }
  .type-card-preview{
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:6px;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .type-card-sub{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:6px;
    font-weight:600;
  }

  /* Important dates box — full-height sidebar next to tiles + aligned messages */
  .dates-box{
    border:1.5px solid var(--line);
    border-left:5px solid var(--maroon);
    background:rgba(255,255,255,0.65);
    border-radius:11px;
    padding:14px 16px;
    height:100%;
  }
  .dates-box-label{
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--maroon);
    font-weight:800;
    margin:0 0 7px 0;
  }
  .dates-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .dates-list li{
    font-size:12px;
    color:var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    line-height:1.35;
    background:var(--maroon-soft);
    border-radius:20px;
    padding:8px 12px;
  }
  .dates-list .d-date{
    color:var(--maroon);
    font-weight:700;
    white-space:nowrap;
    flex-shrink:0;
    background:rgba(255,255,255,0.65);
    border-radius:20px;
    padding:2px 9px;
    font-size:11px;
  }
  .dates-empty{
    font-size:11.5px;
    color:var(--ink-faint);
    font-style:italic;
  }

  /* ---- Aligned messages, per week ---- */
  .week-aligned-label{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:800;
    margin:16px 0 11px 0;
    padding-top:16px;
    border-top:1.5px solid var(--line);
  }
  .aligned-item{
    margin-bottom:9px;
  }
  .aligned-item:last-child{margin-bottom:0;}
  .aligned-item .msg-box{
    border:1.5px solid var(--line);
    border-left:5px solid var(--navy);
    border-radius:11px;
    padding:13px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    background:rgba(255,255,255,0.65);
    text-align:left;
    font-size:14px;
    color:inherit;
    width:100%;
    transition:box-shadow .18s ease, transform .18s ease, background .18s ease;
  }
  .aligned-item .msg-box:hover{
    box-shadow:0 8px 20px rgba(20,30,45,0.12);
    transform:translateY(-2px);
    background:rgba(255,255,255,0.92);
  }
  .aligned-item .dept-name{
    font-weight:700;
    color:var(--navy);
  }
  .aligned-item .msg-theme{
    color:var(--ink-soft);
  }
  .aligned-item .due{
    color:var(--maroon);
    font-weight:700;
    white-space:nowrap;
    font-size:12px;
    background:var(--maroon-soft);
    border-radius:20px;
    padding:6px 13px;
    flex-shrink:0;
  }
  .empty-cell{
    color:var(--ink-faint);
    font-style:italic;
    font-size:13.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px dashed var(--line);
    border-radius:11px;
    padding:16px;
    text-align:center;
  }

  /* ---- Type index pages ---- */
  .page-glass{
    background:var(--card);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1.5px solid rgba(255,255,255,0.55);
    border-radius:16px;
    padding:32px 36px;
    box-shadow:0 10px 30px rgba(10,20,35,0.18);
  }
  .type-page-title{
    font-size:29px;
    font-weight:700;
    margin:0 0 6px 0;
  }
  .type-page-sub{
    font-size:14px;
    color:var(--ink-faint);
    margin-bottom:26px;
  }
  .back-link{
    display:inline-block;
    font-size:13.5px;
    font-weight:700;
    color:#e8eef4;
    text-decoration:none;
    margin-bottom:16px;
    cursor:pointer;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.24);
    border-radius:20px;
    padding:7px 16px;
  }
  .back-link:hover{background:rgba(255,255,255,0.2);}
  .type-entry{
    background:rgba(255,255,255,0.7);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:20px 24px;
    margin-bottom:16px;
    transition:box-shadow .3s ease, border-color .3s ease;
    scroll-margin-top:90px;
  }
  .type-entry.highlighted{
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy-soft);
    background:rgba(255,255,255,0.95);
  }
  .type-entry-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .type-entry-week{
    font-size:13px;
    font-weight:700;
    color:var(--ink-faint);
  }
  .type-entry-theme{
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
  }
  .type-entry-body{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .type-entry-body p{margin:0 0 12px 0;}
  .type-entry-body p:last-child{margin-bottom:0;}
  .type-entry-body .src-label{
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:700;
    display:block;
    margin-bottom:4px;
  }
  .type-entry-link{
    display:inline-block;
    margin-top:6px;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    padding:8px 17px;
    border-radius:20px;
    transition:opacity .15s ease;
  }
  .type-entry-link:hover{opacity:0.8;}
  .type-entry-link.rm{background:var(--navy-soft); color:var(--navy);}
  .type-entry-link.fs{background:var(--forest-soft); color:var(--forest);}
  .type-entry-link.sm{background:var(--gold-soft); color:var(--gold);}
  .type-entry-empty{
    font-style:italic;
    color:var(--ink-faint);
    font-size:13.5px;
  }

  /* ---- Departments list & detail ---- */
  .dept-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:14px;
  }
  .dept-card{
    background:rgba(255,255,255,0.7);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    text-align:left;
    transition:box-shadow .18s ease, transform .18s ease, background .18s ease;
  }
  .dept-card:hover{
    box-shadow:0 8px 20px rgba(20,30,45,0.13);
    transform:translateY(-3px);
    background:rgba(255,255,255,0.95);
  }
  .dept-card-name{
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .dept-card-count{
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .dept-entry{
    background:rgba(255,255,255,0.7);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:16px 20px;
    margin-bottom:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    transition:box-shadow .18s ease, transform .18s ease, background .18s ease;
    scroll-margin-top:90px;
  }
  .dept-entry:hover{
    box-shadow:0 8px 20px rgba(20,30,45,0.12);
    transform:translateY(-2px);
    background:rgba(255,255,255,0.95);
  }
  .dept-entry.highlighted{
    border-color:var(--navy);
    box-shadow:0 0 0 3px var(--navy-soft);
    background:rgba(255,255,255,0.95);
  }
  .dept-entry-left{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .dept-entry-week{
    font-size:11.5px;
    color:var(--ink-faint);
    font-weight:700;
  }
  .dept-entry-label{
    font-size:14.5px;
    color:var(--ink);
    font-weight:700;
  }
  .dept-detail-due{
    color:var(--maroon);
    font-weight:700;
    white-space:nowrap;
    font-size:12px;
    background:var(--maroon-soft);
    border-radius:20px;
    padding:8px 14px;
  }

  @media (max-width:760px){
    #main{padding:28px 18px;}
    #topbar{padding:14px 18px; flex-wrap:wrap; gap:10px;}
    .overview-layout{flex-direction:column;}
    .week-sidebar{
      position:static;
      max-height:none;
      width:100% !important;
      padding-bottom:4px;
    }
    .week-sidebar.collapsed .week-sidebar-items{display:none;}
    .week-sidebar-items{
      flex-direction:row;
      overflow-x:auto;
      overflow-y:visible;
    }
    .week-sidebar-item{flex-shrink:0;}
    .week-body{grid-template-columns:1fr;}
    .card-row{grid-template-columns:1fr 1fr;}
    .dept-entry{flex-direction:column; align-items:flex-start;}
    .aligned-item .msg-box{flex-direction:column; align-items:flex-start;}
    .page-glass{padding:24px 20px;}
  }
</style>
</head>
<body>

<div id="topbar">
  <div>
    <p class="brand-eyebrow">SASP · Communications</p>
    <p class="brand-title">Fall 2026 Weekly Overview</p>
  </div>
  <div id="nav-links">
    <button class="nav-btn" data-view="home">Overview</button>
    <button class="nav-btn" data-view="rm">Signalvine Text</button>
    <button class="nav-btn" data-view="fs">Faculty slides</button>
    <button class="nav-btn" data-view="sm">Social slides</button>
    <button class="nav-btn" data-view="dept">Departments</button>
  </div>
</div>

<main id="main"></main>

const main = document.getElementById('main');
const navBtns = document.querySelectorAll('.nav-btn');

function setActiveNav(view){
  navBtns.forEach(b => b.classList.toggle('active', b.dataset.view === view));
}

function previewText(week){
  if (!week.reenrollment.length) return "Not added yet";
  const t = week.reenrollment[0].text;
  return t.length > 70 ? t.slice(0, 70) + "…" : t;
}

function renderHome(){
  setActiveNav('home');

  const sidebarItems = WEEKS.map((w, wi) => `
      <button class="week-sidebar-item" data-week="${wi}">${w.weekLabel}</button>`).join('');

  const tables = WEEKS.map((w, wi) => {
    const alignedHTML = w.aligned.length
      ? w.aligned.map((a, ai) => `
          <div class="aligned-item">
            <button class="msg-box" data-week="${wi}" data-aligned="${ai}">
              <span><span class="dept-name">${a.sentBy}:</span> <span class="msg-theme">${a.theme}</span></span>
              <span class="due">${a.due ? 'Due ' + a.due : 'Date TBD'}</span>
            </button>
          </div>`).join('')
      : `<span class="empty-cell">No aligned messages logged yet.</span>`;

    const datesHTML = w.dates.length
      ? `<ul class="dates-list">${w.dates.map(d => `<li><span>${d.label}</span><span class="d-date">${d.date}</span></li>`).join('')}</ul>`
      : `<span class="dates-empty">None logged yet.</span>`;

    return `
      <div class="week-table" id="week-${wi}">
        <div class="week-head">
          <div class="week-block-meta">${w.weekLabel}</div>
          <div class="week-block-period">${w.periodStart} &ndash; ${w.periodEnd}</div>
          <h2>${w.theme}</h2>
          ${w.themeApproved === false ? `<p class="theme-pending">Theme pending approval</p>` : ''}
        </div>
        <div class="week-body">
          <div class="week-left">
            <div class="card-row">
              <button class="type-card rm" data-view="rm" data-week="${wi}">
                <div class="type-card-label">Signalvine Text</div>
                <div class="type-card-preview">${previewText(w)}</div>
              </button>
              <button class="type-card fs" data-view="fs" data-week="${wi}">
                <div class="type-card-label">Faculty slide</div>
                <div class="type-card-sub">${w.faculty.href ? 'View slide ›' : 'Not added yet'}</div>
              </button>
              <button class="type-card sm" data-view="sm" data-week="${wi}">
                <div class="type-card-label">Social slide</div>
                <div class="type-card-sub">${w.social.href ? 'View slide ›' : 'Not added yet'}</div>
              </button>
            </div>
            <p class="week-aligned-label">Aligned messages &amp; due dates</p>
            ${alignedHTML}
          </div>
          <div class="dates-box">
            <p class="dates-box-label">Important dates this week</p>
            ${datesHTML}
          </div>
        </div>
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="overview-layout">
      <nav class="week-sidebar" id="week-sidebar">
        <div class="week-sidebar-head">
          <span class="week-sidebar-head-label">Weeks</span>
          <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Collapse">&laquo;</button>
        </div>
        <div class="week-sidebar-items">${sidebarItems}</div>
      </nav>
      <div class="overview-weeks" id="overview-weeks">${tables}</div>
    </div>`;

  document.querySelectorAll('.type-card').forEach(btn => {
    btn.addEventListener('click', () => renderTypePage(btn.dataset.view, parseInt(btn.dataset.week, 10)));
  });
  document.querySelectorAll('.aligned-item .msg-box').forEach(btn => {
    btn.addEventListener('click', () => {
      const wi = parseInt(btn.dataset.week, 10);
      const ai = parseInt(btn.dataset.aligned, 10);
      renderDeptDetail(WEEKS[wi].aligned[ai].sentBy, wi, ai, 'home');
    });
  });

  const sidebarNav = document.getElementById('week-sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  sidebarToggle.addEventListener('click', () => {
    const isCollapsed = sidebarNav.classList.toggle('collapsed');
    sidebarToggle.innerHTML = isCollapsed ? '&raquo;' : '&laquo;';
    sidebarToggle.title = isCollapsed ? 'Expand' : 'Collapse';
  });

  const sidebarBtns = document.querySelectorAll('.week-sidebar-item');
  sidebarBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const wi = btn.dataset.week;
      sidebarBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = document.getElementById(`week-${wi}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        target.classList.add('jump-highlighted');
        setTimeout(() => target.classList.remove('jump-highlighted'), 2200);
      }
    });
  });

  // Keep the sidebar in sync as the person scrolls through the weeks manually
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const wi = entry.target.id.replace('week-', '');
          sidebarBtns.forEach(b => b.classList.toggle('active', b.dataset.week === wi));
        }
      });
    }, { rootMargin: '-110px 0px -60% 0px', threshold: 0 });
    document.querySelectorAll('.week-table').forEach(el => observer.observe(el));
  }
}

function renderTypePage(type, highlightIndex){
  setActiveNav(type);

  const config = {
    rm: { title: "Signalvine Text", sub: "The full Signal Vine message sent to students each week.", accent: "rm" },
    fs: { title: "Faculty slides", sub: "The faculty-facing slide or graphic for each week.", accent: "fs" },
    sm: { title: "Social slides", sub: "The social media graphic for each week.", accent: "sm" }
  }[type];

  let html = `<button class="back-link" id="type-back">&lsaquo; Back to overview</button><div class="page-glass">
    <p class="type-page-title">${config.title}</p>
    <p class="type-page-sub">${config.sub}</p>`;

  WEEKS.forEach((w, i) => {
    const isHighlighted = i === highlightIndex;
    html += `<div class="type-entry${isHighlighted ? ' highlighted' : ''}" id="entry-${type}-${i}">
      <div class="type-entry-head">
        <span class="type-entry-week">${w.weekLabel} &middot; ${w.date}</span>
        <span class="type-entry-theme">${w.theme}</span>
      </div>`;

    if (type === 'rm') {
      html += w.reenrollment.length
        ? `<div class="type-entry-body">${w.reenrollment.map(m => `
        <p>${m.source ? `<span class="src-label">${m.source}</span>` : ''}${m.text}</p>`).join('')}</div>`
        : `<p class="type-entry-empty">Not added yet.</p>`;
    } else {
      const data = type === 'fs' ? w.faculty : w.social;
      if (data && data.href) {
        html += `<a class="type-entry-link ${config.accent}" href="${data.href}" target="_blank" rel="noopener">Open &rsaquo;</a>`;
      } else {
        html += `<p class="type-entry-empty">Not added yet.</p>`;
      }
    }
    html += `</div>`;
  });

  html += `</div>`;
  main.innerHTML = html;

  document.getElementById('type-back').addEventListener('click', renderHome);

  if (Number.isInteger(highlightIndex)) {
    const target = document.getElementById(`entry-${type}-${highlightIndex}`);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/* ---- Departments: list -> department detail (highlightable) -> single message detail ---- */

function getDepartments(){
  const names = new Set();
  WEEKS.forEach(w => w.aligned.forEach(a => names.add(a.sentBy)));
  return Array.from(names).sort();
}

function renderDeptList(){
  setActiveNav('dept');
  const depts = getDepartments();

  let html = `<div class="page-glass">
    <p class="type-page-title">Departments</p>
    <p class="type-page-sub">Every department's messages, organized by who sent them.</p>
    <div class="dept-grid">
      <button class="dept-card" data-dept="__reenrollment__">
        <div class="dept-card-name">Reenrollment Group</div>
        <div class="dept-card-count">${WEEKS.length} message${WEEKS.length === 1 ? '' : 's'}</div>
      </button>`;

  if (depts.length) {
    const counts = depts.map(name => {
      let count = 0;
      WEEKS.forEach(w => w.aligned.forEach(a => { if (a.sentBy === name) count++; }));
      return { name, count };
    });
    html += counts.map(d => `
      <button class="dept-card" data-dept="${d.name}">
        <div class="dept-card-name">${d.name}</div>
        <div class="dept-card-count">${d.count} message${d.count === 1 ? '' : 's'}</div>
      </button>`).join('');
  }
  html += `</div></div>`;

  main.innerHTML = html;
  document.querySelectorAll('.dept-card').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.dept === '__reenrollment__') renderTypePage('rm');
      else renderDeptDetail(btn.dataset.dept);
    });
  });
}

function renderDeptDetail(deptName, highlightWeek, highlightAligned, fromView){
  setActiveNav('dept');

  const backHTML = fromView === 'home'
    ? `<button class="back-link" id="dept-back">&lsaquo; Back to overview</button>`
    : `<button class="back-link" id="dept-back">&lsaquo; Back to departments</button>`;

  let html = `${backHTML}<div class="page-glass">
    <p class="type-page-title">${deptName}</p>
    <p class="type-page-sub">All aligned messages sent by ${deptName}, across weeks.</p>`;

  const entries = [];
  WEEKS.forEach((w, wi) => {
    w.aligned.forEach((a, ai) => {
      if (a.sentBy === deptName) entries.push({ wi, ai, w, a });
    });
  });

  if (!entries.length) {
    html += `<p class="type-entry-empty">No messages logged yet.</p>`;
  } else {
    html += entries.map(e => {
      const isHighlighted = e.wi === highlightWeek && e.ai === highlightAligned;
      return `
      <button class="dept-entry${isHighlighted ? ' highlighted' : ''}" id="dept-entry-${e.wi}-${e.ai}" data-week="${e.wi}" data-aligned="${e.ai}">
        <div class="dept-entry-left">
          <span class="dept-entry-week">${e.w.weekLabel} &middot; ${e.w.date}</span>
          <span class="dept-entry-label">${e.a.theme}</span>
        </div>
        <span class="dept-detail-due">Due ${e.a.due}</span>
      </button>`;
    }).join('');
  }
  html += `</div>`;

  main.innerHTML = html;
  document.getElementById('dept-back').addEventListener('click', () => {
    if (fromView === 'home') renderHome();
    else renderDeptList();
  });
  document.querySelectorAll('.dept-entry').forEach(btn => {
    btn.addEventListener('click', () => {
      renderAlignedDetail(parseInt(btn.dataset.week, 10), parseInt(btn.dataset.aligned, 10), deptName, highlightWeek, highlightAligned, fromView);
    });
  });

  if (Number.isInteger(highlightWeek) && Number.isInteger(highlightAligned)) {
    const target = document.getElementById(`dept-entry-${highlightWeek}-${highlightAligned}`);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function renderAlignedDetail(weekIndex, alignedIndex, deptName, highlightWeek, highlightAligned, fromView){
  setActiveNav('dept');
  const w = WEEKS[weekIndex];
  const a = w.aligned[alignedIndex];

  let html = `
    <button class="back-link" id="aligned-back">&lsaquo; Back to ${deptName}</button>
    <div class="page-glass">
    <p class="type-page-title">${a.theme}</p>
    <p class="type-page-sub">${a.sentBy} &middot; ${w.weekLabel} &middot; ${w.date} &middot; Due ${a.due}</p>

    <div class="type-entry">
      <div class="type-entry-head"><span class="type-entry-week">Message</span></div>
      ${a.message ? `<div class="type-entry-body"><p>${a.message}</p></div>` : `<p class="type-entry-empty">Not added yet.</p>`}
    </div>

    <div class="type-entry">
      <div class="type-entry-head"><span class="type-entry-week">Faculty slide</span></div>
      ${a.faculty && a.faculty.href ? `<a class="type-entry-link fs" href="${a.faculty.href}" target="_blank" rel="noopener">Open &rsaquo;</a>` : `<p class="type-entry-empty">Not added yet.</p>`}
    </div>

    <div class="type-entry">
      <div class="type-entry-head"><span class="type-entry-week">Social slide</span></div>
      ${a.social && a.social.href ? `<a class="type-entry-link sm" href="${a.social.href}" target="_blank" rel="noopener">Open &rsaquo;</a>` : `<p class="type-entry-empty">Not added yet.</p>`}
    </div>
    </div>`;

  main.innerHTML = html;

  document.getElementById('aligned-back').addEventListener('click', () => {
    renderDeptDetail(deptName, highlightWeek, highlightAligned, fromView);
  });
}

navBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.view === 'home') renderHome();
    else if (btn.dataset.view === 'dept') renderDeptList();
    else renderTypePage(btn.dataset.view);
  });
});

renderHome();
